name: AILimits
options:
  bundleIdPrefix: com.teazy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "0.6.0"
  CURRENT_PROJECT_VERSION: "9"
targets:
  AILimits:
    type: application
    platform: iOS
    sources:
      - path: AILimits
        excludes:
          - "*.entitlements"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.teazy.ailimits
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: AILimits/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: AI Limits
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: AILimits/AILimits.entitlements
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: UsageWidget
        embed: true
        codeSign: false
  UsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
      - path: AILimits/Models.swift
      - path: AILimits/AppGroup.swift
      - path: AILimits/UsageStore.swift
      - path: AILimits/TokenStore.swift
      - path: AILimits/BillingClient.swift
      - path: AILimits/XAIAuth.swift
      - path: AILimits/RefreshIntent.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.teazy.ailimits.widget
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Widget/Info.plist
      CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
      CODE_SIGNING_ALLOWED: NO
      SKIP_INSTALL: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
