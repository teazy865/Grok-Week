name: AILimits
options:
  bundleIdPrefix: com.teazy
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "0.1"
  CURRENT_PROJECT_VERSION: "1"
targets:
  AILimits:
    type: application
    platform: iOS
    sources:
      - path: AILimits
    info:
      path: AILimits/Info.plist
      properties:
        CFBundleDisplayName: AI Limits
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.teazy.ailimits
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      INFOPLIST_FILE: AILimits/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
